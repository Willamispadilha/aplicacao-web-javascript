<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imóveis Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏠 Imóveis Fácil</h1>
        <p>Cadastro e gerenciamento de imóveis</p>
    </header>

    <main>

        <section class="formulario">
            <h2>Cadastrar imóvel</h2>

            <form id="formImovel">

                <label for="tipo">Tipo de imóvel</label>

                <select id="tipo" required>
                    <option value="">Selecione</option>
                    <option value="Casa">Casa</option>
                    <option value="Apartamento">Apartamento</option>
                    <option value="Terreno">Terreno</option>
                    <option value="Comercial">Comercial</option>
                </select>

                <label for="endereco">Endereço</label>

                <input
                    type="text"
                    id="endereco"
                    placeholder="Digite o endereço"
                    required
                >

                <label for="preco">Preço</label>

                <input
                    type="number"
                    id="preco"
                    placeholder="Digite o preço"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Cadastrar imóvel</button>

            </form>
        </section>


        <section class="lista">

            <h2>Imóveis cadastrados</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="🔎 Pesquisar por endereço..."
            >

            <select id="filtroTipo">
                <option value="">Todos os imóveis</option>
                <option value="Casa">Casas</option>
                <option value="Apartamento">Apartamentos</option>
                <option value="Terreno">Terrenos</option>
                <option value="Comercial">Comerciais</option>
            </select>

            <div id="listaImoveis">
                <p>Nenhum imóvel cadastrado.</p>
            </div>

        </section>

    </main>


    <footer>
        <p>Projeto acadêmico - Análise e Desenvolvimento de Sistemas</p>
        <p>Desenvolvido por Willamis Padilha Ferreira</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
